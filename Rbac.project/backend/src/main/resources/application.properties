spring.application.name=identity-auditor
server.port=8081

# Active profile: 'dev' (built-in H2 in MySQL mode) or 'mysql' (external MySQL 8 database)
# To use MySQL 8: change to 'mysql' or run with --spring.profiles.active=mysql
spring.profiles.active=dev

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT Configuration (256-bit secure secret key)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# Privilege Creep Detection Settings
identity.auditor.privilege-creep.inactivity-threshold-days=30
# Scheduled cron runs every midnight (or customizable)
identity.auditor.privilege-creep.cron=0 0 0 * * ?
